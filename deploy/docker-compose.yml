services:
  assistant:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    volumes:
      - ../data:/data
    restart: unless-stopped
    # Only needed for the Twilio (WhatsApp/SMS) webhook. Put Caddy or a tunnel in front.
    ports:
      - "127.0.0.1:8081:8081"
