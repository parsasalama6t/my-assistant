[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-assistant"
version = "0.1.0"
description = "A personal assistant powered by Claude: tasks, notes, calendar, memory, and chat."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=1.5.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
google = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2", "google-auth-httplib2>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
my-assistant = "assistant.cli:main"

[tool.setuptools.packages.find]
include = ["assistant*"]

[tool.setuptools.package-data]
assistant = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
