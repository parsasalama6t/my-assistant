<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Assistant</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66;
    --line: #e4e4df; --accent: #2f6f5e; --accent-ink: #ffffff; --user: #e8f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151614; --panel: #1f201d; --ink: #ecece8; --muted: #a2a29b;
            --line: #33342f; --accent: #6fbf9f; --accent-ink: #10201a; --user: #24302b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
         background: var(--bg); color: var(--ink); }
  .app { display: grid; grid-template-columns: 1fr 300px; height: 100vh; }
  @media (max-width: 800px) { .app { grid-template-columns: 1fr; } aside { display: none; } }
  main { display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; }
  header .meta { color: var(--muted); font-size: 13px; flex: 1; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel);
           color: var(--ink); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 760px; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap;
         word-wrap: break-word; }
  .msg.user { background: var(--user); align-self: flex-end; }
  .msg.assistant { background: var(--panel); border: 1px solid var(--line); align-self: flex-start; }
  .msg.error { background: #fde8e6; color: #8a1f11; align-self: flex-start; }
  .tool { color: var(--muted); font-size: 12px; align-self: flex-start; padding: 0 6px; }
  form { display: flex; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line);
         background: var(--panel); }
  textarea { flex: 1; resize: none; font: inherit; padding: 10px 12px; border-radius: 10px;
             border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  aside { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto;
          padding: 16px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); margin: 16px 0 6px; }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  aside li small { display: block; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <main>
    <header>
      <h1>My Assistant</h1>
      <span class="meta" id="meta"></span>
      <button id="new">New conversation</button>
    </header>
    <div id="log"></div>
    <form id="form">
      <textarea id="input" rows="2" placeholder="Ask anything, or tell me what to remember…"></textarea>
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </main>
  <aside>
    <h2>Open tasks</h2><ul id="tasks"></ul>
    <h2>Upcoming events</h2><ul id="events"></ul>
    <h2>Memories</h2><ul id="memories"></ul>
  </aside>
</div>
<script>
const $ = (id) => document.getElementById(id);
let sessionId = null;

function add(role, text) {
  const el = document.createElement("div");
  el.className = "msg " + role;
  el.textContent = text;
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}
function addTool(name, error) {
  const el = document.createElement("div");
  el.className = "tool";
  el.textContent = "⚙ " + name + (error ? " (error)" : "");
  $("log").appendChild(el);
}
function render(id, rows, fmt) {
  const ul = $(id);
  ul.innerHTML = "";
  if (!rows.length) { ul.innerHTML = '<li class="empty">none</li>'; return; }
  for (const r of rows) { const li = document.createElement("li"); li.innerHTML = fmt(r); ul.appendChild(li); }
}
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function refreshSidebar() {
  const [tasks, events, memories] = await Promise.all([
    fetch("/api/tasks").then(r => r.json()),
    fetch("/api/events").then(r => r.json()),
    fetch("/api/memories").then(r => r.json()),
  ]);
  render("tasks", tasks, t => esc(t.title) + (t.due ? `<small>due ${esc(t.due)}</small>` : ""));
  render("events", events, e => esc(e.title) + `<small>${esc(e.start)}${e.location ? " · " + esc(e.location) : ""}</small>`);
  render("memories", memories, m => esc(m.content) + `<small>${esc(m.category)}</small>`);
}

async function loadHistory() {
  $("log").innerHTML = "";
  const turns = await fetch(`/api/sessions/${sessionId}/messages`).then(r => r.json());
  for (const t of turns) add(t.role, t.text);
}

async function init() {
  const cfg = await fetch("/api/config").then(r => r.json());
  sessionId = cfg.session_id;
  $("meta").textContent = `${cfg.model} · effort ${cfg.effort}`;
  await loadHistory();
  await refreshSidebar();
}

$("new").onclick = async () => {
  const r = await fetch("/api/sessions", { method: "POST" }).then(r => r.json());
  sessionId = r.session_id;
  $("log").innerHTML = "";
};

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});

$("form").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  $("send").disabled = true;
  add("user", text);
  const el = add("assistant", "");
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId }),
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const ev = /^event: (.*)$/m.exec(chunk)?.[1];
        const data = JSON.parse(/^data: (.*)$/m.exec(chunk)?.[1] ?? "null");
        if (ev === "text") { el.textContent += data; $("log").scrollTop = $("log").scrollHeight; }
        else if (ev === "tool") { addTool(data.name, data.error); $("log").appendChild(el); }
        else if (ev === "error") { el.className = "msg error"; el.textContent = data.message; }
        else if (ev === "done") { sessionId = data.session_id; if (!el.textContent && data.text) el.textContent = data.text; }
      }
    }
  } catch (err) {
    el.className = "msg error"; el.textContent = "Connection lost: " + err;
  } finally {
    $("send").disabled = false;
    $("input").focus();
    refreshSidebar();
  }
};

init();
</script>
</body>
</html>
